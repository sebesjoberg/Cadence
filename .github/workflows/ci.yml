name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write   # test-reporter publishes results as a check run

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # global.json is a floor, not a pin: rollForward is latestFeature.
      - name: Install the SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Cadence.Dashboard's SPA bundle is a build output, not a checked-in artifact -- MSBuild
      # shells out to npm to produce it, so Node has to be on the path before Restore/Build.
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Cadence.Dashboard/ui/package-lock.json

      - name: Restore
        run: dotnet restore Cadence.slnx

      # Warnings are errors via Directory.Build.props, so this is the analyzer gate too.
      - name: Build
        run: dotnet build Cadence.slnx --configuration Release --no-restore

      # The runner exposes /var/run/docker.sock, so SqlServerFixture starts a real SQL Server here
      # rather than skipping.
      - name: Test
        id: test
        run: >
          dotnet test Cadence.slnx --configuration Release --no-build
          --logger trx --results-directory artifacts/test-results

      # Publish on failure too — that is when the detail matters.
      - name: Upload test results
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx

      # A per-assembly table on the run page itself. The check run above says pass or fail; this
      # says how much ran, which is what catches a suite that silently stopped being collected.
      - name: Summarise test results
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, xml.etree.ElementTree as ET

          ns = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          rows, totals = [], [0, 0, 0, 0]

          for path in sorted(glob.glob('artifacts/test-results/*.trx')):
              root = ET.parse(path).getroot()
              counters = root.find(f'{ns}ResultSummary/{ns}Counters')
              if counters is None:
                  continue

              unit = root.find(f'{ns}TestDefinitions/{ns}UnitTest')
              name = os.path.basename(unit.get('storage', path)) if unit is not None else path
              got = [int(counters.get(k, 0)) for k in ('total', 'passed', 'failed', 'notExecuted')]

              rows.append((name.removesuffix('.dll'), *got))
              totals = [a + b for a, b in zip(totals, got)]

          print('## .NET tests')
          print()
          print('| Suite | Total | Passed | Failed | Skipped |')
          print('|---|--:|--:|--:|--:|')
          for row in rows:
              print('| `{}` | {} | {} | {} | {} |'.format(*row))
          print('| **Total** | **{}** | **{}** | **{}** | **{}** |'.format(*totals))
          PY

      # Third party holding checks: write, so pinned by digest. a43b3a5 is v3.0.0.
      - name: Publish test report
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: tests
          path: artifacts/test-results/*.trx
          reporter: dotnet-trx

  # Runs in parallel with build-test rather than as a step inside it, so a lint or unit-test failure
  # in the SPA is reported on its own check rather than buried inside a passing dotnet build (the
  # MSBuild target that builds the bundle only runs `npm run build`, never lint or test).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/Cadence.Dashboard/ui

    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Cadence.Dashboard/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Two reporters: the default one keeps the log readable, the JUnit one is what the check run
      # below is built from. Vitest ships both, so this needs no extra dependency.
      - name: Test
        id: test
        run: >
          npm test --
          --reporter=default --reporter=junit
          --outputFile.junit=test-results/frontend.xml

      # Publish on failure too — that is when the detail matters.
      - name: Upload test results
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: src/Cadence.Dashboard/ui/test-results/frontend.xml

      # The same shape as the .NET summary, so one run page reads consistently top to bottom.
      - name: Summarise test results
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          root = ET.parse('test-results/frontend.xml').getroot()
          rows, totals = [], [0, 0, 0, 0]

          for suite in root.findall('testsuite'):
              got = [int(suite.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped')]
              total, failures, errors, skipped = got
              row = (total, total - failures - errors - skipped, failures + errors, skipped)

              rows.append((suite.get('name', '?'), *row))
              totals = [a + b for a, b in zip(totals, row)]

          print('## Frontend tests')
          print()
          print('| Suite | Total | Passed | Failed | Skipped |')
          print('|---|--:|--:|--:|--:|')
          for row in rows:
              print('| `{}` | {} | {} | {} | {} |'.format(*row))
          print('| **Total** | **{}** | **{}** | **{}** | **{}** |'.format(*totals))
          PY

      # Same pinned digest as the .NET job. Vitest's JUnit output is the shape jest-junit reads.
      - name: Publish test report
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: frontend tests
          path: src/Cadence.Dashboard/ui/test-results/frontend.xml
          reporter: jest-junit
