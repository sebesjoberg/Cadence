name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write   # test-reporter publishes results as a check run

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # global.json is a floor, not a pin: rollForward is latestFeature.
      - name: Install the SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Cadence.slnx

      # Warnings are errors via Directory.Build.props, so this is the analyzer gate too.
      - name: Build
        run: dotnet build Cadence.slnx --configuration Release --no-restore

      # The runner exposes /var/run/docker.sock, so SqlServerFixture starts a real SQL Server here
      # rather than skipping.
      - name: Test
        id: test
        run: >
          dotnet test Cadence.slnx --configuration Release --no-build
          --logger trx --results-directory artifacts/test-results

      # Publish on failure too — that is when the detail matters.
      - name: Upload test results
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx

      # Third party holding checks: write, so pinned by digest. a43b3a5 is v3.0.0.
      - name: Publish test report
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: tests
          path: artifacts/test-results/*.trx
          reporter: dotnet-trx
